name: Develop Match Intelligence CI
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPORTSAPI_WS_ENABLED: "true"
      SPORTSAPI_DAILY_REQUEST_BUDGET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm lint
      - name: Unit and regression tests (no live provider calls)
        run: pnpm test
      - name: Production build validation (develop only)
        run: pnpm build
