name: Deploy LowBlock Admin Console
on:
  push:
    branches: [feature/admin-panel]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to deploy as the admin instance
        required: true
        default: feature/admin-panel
        type: string
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Request isolated admin deployment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SERVER_DEPLOY_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          payload=$(jq -n --arg source_ref "$SOURCE_REF" '{ref:"main",inputs:{source_ref:$source_ref}}')
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/AshkaanGiveki/server-deploy/actions/workflows/deploy-lowblock-admin.yml/dispatches \
            -d "$payload"
