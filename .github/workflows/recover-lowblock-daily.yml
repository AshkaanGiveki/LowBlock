name: LowBlock daily football recovery

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this recovery was started
        required: false
        default: manual
  schedule:
    # 03:40 Asia/Tehran (00:10 UTC); the provider quota resets at 03:30.
    - cron: "10 0 * * *"

concurrency:
  group: lowblock-daily-football
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, production]
    timeout-minutes: 30
    steps:
      - name: Verify application container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker inspect --format '{{.State.Status}}' lowblock | grep -qx running
          docker exec lowblock test -x /app/node_modules/.bin/tsx

      - name: Run complete daily football cycle
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -w /app lowblock npm run recover:daily

      - name: Verify provider sync was recorded successfully
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec lowblock node -e '
            const { MongoClient } = require("mongodb");
            const client = new MongoClient(process.env.MONGODB_URI);
            (async () => {
              await client.connect();
              const db = client.db();
              const latest = await db.collection("syncRuns").findOne({}, { sort: { startedAt: -1 } });
              if (!latest || latest.status !== "OK") throw new Error("No successful provider sync was recorded");
              console.log(JSON.stringify({ latestSync: latest, predictionScores: await db.collection("predictionScores").countDocuments({}), leaderboardStats: await db.collection("leaderboardStats").countDocuments({}) }));
              await client.close();
            })().catch(error => { console.error(error); process.exit(1); });
          '
