name: Recover daily football cycle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, production]
    timeout-minutes: 20
    steps:
      - name: Run bounded daily recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          # This command is intentionally the same server-owned cycle used by
          # the worker. It performs only yesterday/today/tomorrow schedule
          # reads: at most three SportsAPI REST requests.
          docker exec lowblock npm run sync:daily
