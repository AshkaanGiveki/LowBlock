name: Diagnose public isolated LowBlock develop preview

on:
  push:
    branches: [develop]
    paths: [.github/workflows/develop-preview-remote-diagnostics.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare preview API and page network responses without provider calls
        shell: bash
        run: |
          set -u
          base=https://lowblock-preview.45.11.186.199.sslip.io
          for path in '/api/matches?limit=1' '/api/matches?limit=30' '/matches' '/preview' '/login' '/help' '/this-page-is-missing'; do
            echo "=== $path ==="
            curl --silent --show-error --location --max-time 12 \
              -w 'status=%{http_code} bytes=%{size_download} first_byte=%{time_starttransfer}s total=%{time_total}s\\n' \
              "$base$path" -o /tmp/lowblock-diagnostic-response || true
            head -c 100 /tmp/lowblock-diagnostic-response | tr '\n' ' ' || true
            echo
            echo 'Last 160 response bytes:'
            tail -c 160 /tmp/lowblock-diagnostic-response | tr '\n' ' ' || true
            echo
          done
          echo '=== Protocol and response-header comparison ==='
          for protocol in --http1.1 --http2; do
            for path in '/api/matches?limit=30' '/matches'; do
              echo "$protocol $path"
              curl "$protocol" --silent --show-error --max-time 15 --location \
                -D /tmp/preview-protocol-headers \
                -w 'status=%{http_code} http_version=%{http_version} bytes=%{size_download} total=%{time_total}s\\n' \
                "$base$path" -o /tmp/preview-protocol-response || true
              grep -Ei '^(server|content-length|transfer-encoding|content-type|content-encoding):' /tmp/preview-protocol-headers | tail -6 || true
            done
          done
          echo "Diagnostic complete; no SportsAPI endpoints contacted."
