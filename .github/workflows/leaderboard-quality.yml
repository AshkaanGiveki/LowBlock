name: Leaderboard Quality Gate

on:
  push:
    branches:
      - perf/leaderboard-snapshot-foundation-20261123
  pull_request:
    paths:
      - "lib/domain/leaderboard*.ts"
      - "lib/scoring/scoreEngine.ts"
      - "lib/db/mongo.ts"
      - "app/lowblock/**"
      - "app/leaderboard/**"
      - "components/LeaderboardExplorer.tsx"
      - "tests/leaderboard-publications.test.ts"
      - "package.json"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
